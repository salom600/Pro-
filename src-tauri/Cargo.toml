[package]
name = "pro-video-editor"
version = "0.1.0"
description = "Pro — a modern cross-platform video editor"
authors = ["salom600"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/salom600/Pro-"
homepage = "https://github.com/salom600/Pro-"

[lib]
name = "pro_video_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dirs = "5"
walkdir = "2"

# Video / media — optional because the FFmpeg system libraries
# are not always present on minimal CI runners. The build still
# succeeds without them; media probing falls back to extension
# heuristics and thumbnails become placeholders.
ffmpeg-next = { version = "7", optional = true }

[features]
default = []
# Enable real FFmpeg probing/thumbnailing. Requires FFmpeg dev libs.
ffmpeg = ["dep:ffmpeg-next"]

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
