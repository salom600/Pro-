[package]
name = "pro-video-editor"
version = "0.2.0"
description = "Pro — a native, GPU-accelerated video editor built in pure Rust"
authors = ["salom600"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/salom600/Pro-"
homepage = "https://github.com/salom600/Pro-"
keywords = ["video", "editor", "gui", "egui", "native"]
categories = ["multimedia::video", "graphics"]

[[bin]]
name = "pro-video-editor"
path = "src/main.rs"

[lib]
name = "pro_video_editor"
path = "src/lib.rs"

[dependencies]
# GUI — pure Rust, immediate mode, no browser
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }

# Native file dialogs
rfd = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# State / concurrency
parking_lot = "0.12"
rayon = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
dirs = "5"

# Media — optional, gated behind feature flag for portable CI builds.
# When disabled, probing falls back to extension heuristics.
ffmpeg-next = { version = "7", optional = true }

[features]
default = []
ffmpeg = ["dep:ffmpeg-next"]

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Linux: keep debug symbols in the .deb for better crash reports
[profile.release.package."*"]
opt-level = 3
