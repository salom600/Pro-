[package]
name = "pro-video-editor"
version = "0.3.0"
description = "Pro — professional video editor: Rust engine + Qt UI"
authors = ["salom600"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/salom600/Pro-"

[lib]
name = "pro_video_editor"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rayon = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
dirs = "5"
ffmpeg-next = { version = "9", optional = true }

[features]
default = []
ffmpeg = ["dep:ffmpeg-next"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
