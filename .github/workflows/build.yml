name: Build

"on":
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            artifact_name: pro-video-editor
            artifact_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            artifact_name: pro-video-editor.exe
            artifact_ext: ".exe"
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
            artifact_name: pro-video-editor
            artifact_ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x64
            artifact_name: pro-video-editor
            artifact_ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.label }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ matrix.label }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} package/
          cp README.md LICENSE package/ 2>/dev/null || true
          tar czf pro-video-editor-${{ matrix.label }}.tar.gz -C package .
          ls -la pro-video-editor-${{ matrix.label }}.tar.gz

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "package/"
          Copy-Item "README.md" "package/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "package/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "package/*" -DestinationPath "pro-video-editor-${{ matrix.label }}.zip"
          Get-ChildItem "pro-video-editor-${{ matrix.label }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pro-video-editor-${{ matrix.label }}
          path: |
            pro-video-editor-${{ matrix.label }}.tar.gz
            pro-video-editor-${{ matrix.label }}.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## Build — ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -la target/${{ matrix.target }}/release/pro-video-editor* 2>/dev/null || echo "No binary found"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Binary size: $(du -h target/${{ matrix.target }}/release/pro-video-editor* 2>/dev/null | head -1 | cut -f1 || echo 'unknown')"

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pro Video Editor ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body: |
            ## Pro Video Editor ${{ github.ref_name }}

            Native cross-platform video editor — pure Rust + egui + wgpu. No browser.

            ### Install
            - **Windows**: download `.zip`, extract, run `pro-video-editor.exe`.
            - **macOS**: download `.tar.gz`, extract, run `./pro-video-editor` (may need `xattr -dr com.apple.quarantine`).
            - **Linux**: download `.tar.gz`, extract, run `./pro-video-editor`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
