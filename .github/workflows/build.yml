name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Keep FFmpeg feature OFF in CI for max portability — the build still
  # produces a fully working app; media probing falls back to extension
  # heuristics. Enable the feature locally with: cargo build --features ffmpeg
  CARGO_FEATURES: ""

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            artifact_ext: deb
            extra_artifact_ext: AppImage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            artifact_ext: msi
            extra_artifact_ext: exe
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
            artifact_ext: dmg
            extra_artifact_ext: app
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x64
            artifact_ext: dmg
            extra_artifact_ext: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.label }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ matrix.label }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev
          # FFmpeg dev libs are optional — enable in CARGO_FEATURES if you
          # want real media probing in CI artifacts.
          # sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Verify TypeScript compiles
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (debug)
        if: github.event_name == 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --debug

      - name: Build Tauri app (release)
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pro-video-editor-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize build
        if: always()
        shell: bash
        run: |
          echo "## Build summary — ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d src-tauri/target/${{ matrix.target }}/release/bundle ]; then
            echo "Artifacts produced:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            find src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No bundle directory found." >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pro Video Editor ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
          body: |
            ## Pro Video Editor ${{ github.ref_name }}

            Cross-platform installers for Windows, macOS, and Linux.

            ### Install
            - **Windows**: download the `.msi` (or `.exe` NSIS installer) and run it.
            - **macOS**: download the `.dmg`, open it, and drag **Pro Video Editor** to Applications.
            - **Linux**: install the `.deb` with `sudo dpkg -i pro-video-editor_*.deb`,
              or make the `.AppImage` executable and double-click.

            > Foundation release. Timeline, media bin, dual monitors, inspector,
            > effects, and export dialog are all present. Full FFmpeg render
            > pipeline lands in the next iteration.
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
