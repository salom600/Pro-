name: Build

"on":
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"

jobs:
  build-rust:
    name: Build Rust Engine (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            features: ffmpeg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            features: ffmpeg
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
            features: ffmpeg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.label }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ matrix.label }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          BREW_PREFIX="$(brew --prefix ffmpeg)"
          echo "FFMPEG_DIR=${BREW_PREFIX}" >> $GITHUB_ENV
          echo "FFMPEG_INCLUDE_DIR=${BREW_PREFIX}/include" >> $GITHUB_ENV
          echo "FFMPEG_LIBS_DIR=${BREW_PREFIX}/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV
          echo "LIBRARY_PATH=${BREW_PREFIX}/lib:${LIBRARY_PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${BREW_PREFIX}/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I${BREW_PREFIX}/include -L${BREW_PREFIX}/lib" >> $GITHUB_ENV

      - name: Set up MSVC Developer Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg FFmpeg
        id: vcpkg-cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\usr\include
            D:\usr\include
          key: vcpkg-ffmpeg-x64-windows-v5

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Installing FFmpeg via vcpkg (takes ~50 min on first run)..."
          & C:\vcpkg\vcpkg install ffmpeg:x64-windows --x-install-root=C:\vcpkg\installed

      - name: Configure FFmpeg paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $FFMPEG_PREFIX = "C:\vcpkg\installed\x64-windows"
          # Create /usr/include on both drives for ffmpeg-sys-next hardcoded path
          foreach ($drive in @("C:", "D:")) {
            $usrInclude = "$drive\usr\include"
            New-Item -ItemType Directory -Force -Path $usrInclude | Out-Null
            Copy-Item -Path "$FFMPEG_PREFIX\include\*" -Destination $usrInclude -Recurse -Force
          }
          echo "FFMPEG_DIR=$FFMPEG_PREFIX" >> $env:GITHUB_ENV
          echo "FFMPEG_INCLUDE_DIR=$FFMPEG_PREFIX\include" >> $env:GITHUB_ENV
          echo "FFMPEG_LIBS_DIR=$FFMPEG_PREFIX\lib" >> $env:GITHUB_ENV
          echo "LIB=$FFMPEG_PREFIX\lib;$env:LIB" >> $env:GITHUB_ENV
          echo "INCLUDE=$FFMPEG_PREFIX\include;$env:INCLUDE" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          # Build BINDGEN_EXTRA_CLANG_ARGS with all include paths
          $bindgenArgs = "-IC:\usr\include -ID:\usr\include -I$FFMPEG_PREFIX\include"
          if ($env:INCLUDE) {
            $env:INCLUDE -split ';' | ForEach-Object {
              if ($_ -and (Test-Path $_)) { $bindgenArgs += " -I`"$_`"" }
            }
          }
          $sdkBase = "C:\Program Files (x86)\Windows Kits\10\Include"
          if (Test-Path $sdkBase) {
            $sdkVer = Get-ChildItem $sdkBase -Directory | Sort-Object Name -Descending | Select-Object -First 1
            if ($sdkVer) {
              foreach ($sub in @("ucrt", "um", "shared")) {
                $p = "$($sdkVer.FullName)\$sub"
                if (Test-Path $p) { $bindgenArgs += " -I`"$p`"" }
              }
            }
          }
          echo "BINDGEN_EXTRA_CLANG_ARGS=$bindgenArgs" >> $env:GITHUB_ENV
          Write-Host "BINDGEN_EXTRA_CLANG_ARGS: $bindgenArgs"

      - name: Build Rust library
        shell: bash
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Upload Rust library
        uses: actions/upload-artifact@v4
        with:
          name: rust-engine-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/libpro_video_editor.*
            target/${{ matrix.target }}/release/pro_video_editor.*
            target/${{ matrix.target }}/release/*.dll
          if-no-files-found: warn

  build-qt-linux:
    name: Build Qt App (Linux)
    runs-on: ubuntu-22.04
    needs: build-rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev cmake ninja-build

      - name: Download Rust library
        uses: actions/download-artifact@v4
        with:
          name: rust-engine-linux-x64
          path: target/release

      - name: Fix library name
        run: |
          cd target/release
          ls -la
          # Ensure the .so is named correctly
          if [ -f "libpro_video_editor.dylib" ]; then mv libpro_video_editor.dylib libpro_video_editor.so; fi
          chmod +x libpro_video_editor.so 2>/dev/null || true

      - name: Build Qt app
        run: |
          cd qt
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja
          ninja -j$(nproc)

      - name: Package
        run: |
          mkdir -p package
          cp qt/build/ProVideoEditor package/
          cp target/release/libpro_video_editor.so package/
          cp README.md LICENSE package/ 2>/dev/null || true
          cd package
          tar czf ../pro-video-editor-linux-x64.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pro-video-editor-linux-x64
          path: pro-video-editor-linux-x64.tar.gz
          if-no-files-found: warn
